worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # The included file contains only host-to-value mappings, for example:
    #
    #     images.example.com 1;
    #     cdn.example.org    1;
    #
    map $proxy_target_host $is_allowed_host {
        default 0;
        include /etc/nginx/allowed-hosts.conf;
    }

    resolver 9.9.9.9 valid=60s ipv6=off;
    resolver_timeout 5s;

    limit_req_zone $binary_remote_addr zone=image_proxy:10m rate=2r/s;

    server {
        listen 8080;
        server_name _;

        client_max_body_size 1m;

        # Keep temporary files in a writable location for read-only/non-root
        # container deployments.
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;

        location ~ ^/img/(?<proxy_target_host>[A-Za-z0-9.-]+(:[0-9]+)?)/(?<proxy_target_path>.*)$ {
            limit_req zone=image_proxy burst=10 nodelay;

            if ($is_allowed_host = 0) {
                return 403;
            }

            # Only HTTPS targets are supported.
            proxy_ssl_server_name on;
            proxy_ssl_name $proxy_target_host;
            proxy_pass https://$proxy_target_host/$proxy_target_path$is_args$args;

            proxy_set_header Host $proxy_target_host;
            proxy_set_header Referer https://$proxy_target_host/;

            # Do not forward the caller's credentials or proxy-related headers.
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Proxy-Authorization "";
            proxy_set_header Connection "";

            proxy_http_version 1.1;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Accept $http_accept;

            # This proxy returns image bytes to the browser.
            proxy_hide_header Set-Cookie;
            proxy_hide_header Access-Control-Allow-Origin;

            # Set this to the origin(s) from which your frontend is served.
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cross-Origin-Resource-Policy cross-origin always;

            proxy_connect_timeout 5s;
            proxy_read_timeout 20s;
            proxy_send_timeout 20s;

            proxy_buffering on;
            proxy_intercept_errors on;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            root /usr/share/nginx/html;
        }
    }
}